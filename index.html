<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rubber Band Ball</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <header class="top-bar">
        <h1>Rubber Band Ball</h1>
        <div class="top-controls">
          <div id="levelLabel" class="level-label">Level 1/4</div>
          <button id="muteButton" class="mute-button" type="button" aria-pressed="false">Mute</button>
        </div>
      </header>

      <section id="playScreen" class="play-screen" aria-label="Rubber Band Ball game">
        <canvas id="gameCanvas" width="660" height="780" aria-label="Game maze"></canvas>

        <div class="status-row" aria-live="polite">
          <span id="collectedLabel">0 collected</span>
          <span id="remainingLabel">20 left</span>
          <span id="movesLabel">0 moves</span>
          <span id="exitLabel">Collect bands</span>
          <button id="restartLevelButton" class="restart-level" type="button">Restart</button>
        </div>

        <div id="dpad" class="dpad" role="group" aria-label="Movement controls">
          <button class="dpad-button up" type="button" data-direction="up" aria-label="Move up">▲</button>
          <button class="dpad-button left" type="button" data-direction="left" aria-label="Move left">◀</button>
          <button class="dpad-button center" type="button" tabindex="-1" aria-hidden="true">
            <span id="directionStick" class="direction-stick"></span>
          </button>
          <button class="dpad-button right" type="button" data-direction="right" aria-label="Move right">▶</button>
          <button class="dpad-button down" type="button" data-direction="down" aria-label="Move down">▼</button>
        </div>
      </section>

      <section id="victoryScreen" class="victory-screen hidden" aria-label="Victory dance party">
        <h2><span>Welcome to</span><span>The Rubber Band Ball!</span></h2>
        <span class="bopping-ball" aria-hidden="true"></span>
        <div id="danceFloor" class="dance-floor" aria-hidden="true">
          <span class="stage-light left"></span>
          <span class="stage-light right"></span>
          <span class="stage-platform"></span>
          <span class="band-player violin"><span class="rubber-body"></span><span class="instrument"></span></span>
          <span class="band-player drums"><span class="rubber-body"></span><span class="instrument"></span></span>
          <span class="band-player clarinet"><span class="rubber-body"></span><span class="instrument"></span></span>
          <span class="band-player trumpet"><span class="rubber-body"></span><span class="instrument"></span></span>
        </div>
        <div class="victory-credits" aria-live="polite">
          <span class="credit-line title">You win!<br>Enjoy the Ball!</span>
          <span class="credit-line painting">Painting:<br>Nicholas in the Snow<br>by Bo Elder</span>
          <span class="credit-line music">Music:<br>St. Nick's Theme<br>by Eric Elder</span>
          <span class="credit-line orchestration">Orchestration:<br>by Matt Ludwig</span>
          <span class="credit-line produced">Produced:<br>by Eric Elder</span>
          <span class="credit-line enjoy">Enjoy the Ball!</span>
        </div>
        <button id="playAgainButton" class="play-again" type="button">Play Again</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
